<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anime Sliding Puzzle</title>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" href="style.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="bg-shapes">
            <div class="shape shape1"></div>
            <div class="shape shape 2"></div>
        </div>

        <div class="game-container">
            <header class="game-header">
                <h1>ANIME<span>_</span>PUZZLE</h1>
                <p>Slide the tiles to reveal the image</p>
            </header>

            <div class="stats-panel">
                <div class="stat-box">
                    <span class="label">MOVES</span>
                    <span class="value" id="moves">0</span>
                </div>
                <div class="stat-box">
                    <span class="label">TIME</span>
                    <span class="value" id="timer">00:00</span>
                </div>
                <button id="restart-btn" class="btn">RESTART</button>
            </div>

            <div class="board-container">
                <div class="board" id="board"></div>

                <div class="overlay hidden" id="win-overlay">
                    <h2 class="win-text">YOU WIN!</h2>
                    <p>Time: <span id="final-time">00:00</span></p>
                    <p>Moves: <span id="final-moves">0</span></p>
                    <button id="play-again-btn" class="btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <canvas id="confetti-canvas"></canvas>

        <script src="app.js"></script>
    </body>
</html>
